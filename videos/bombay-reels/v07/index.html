<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const K = window.BM;

  /* SA */
  K.push(tl, "#sa-cam", 0, 3.1, 1.0, 1.05);
  tl.fromTo("#sa-l1", { opacity: 0.85, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0);
  K.words(tl, "#sa-hook", 0.25, { stagger: 0.14 });
  tl.fromTo("#board-a", { opacity: 0.4, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, 0);
  tl.to(["#sa-hook .line", "#board-a"], { y: -80, opacity: 0, duration: 0.4, ease: "power3.in", stagger: 0.04 }, 2.7);

  /* SB */
  K.push(tl, "#sb-cam", 3.1, 7.2, 1.0, 1.04);
  tl.fromTo(".gcol", { scaleY: 0, transformOrigin: "50% 0" }, { scaleY: 1, duration: 0.8, ease: "expo.out", stagger: 0.04 }, 3.1);
  tl.fromTo("#aa", { opacity: 0, x: -160, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 3.4);
  tl.fromTo("#shp-c", { x: 300, y: -200, scale: 0.4, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.8, ease: "expo.out" }, 3.7);
  tl.fromTo("#shp-s", { x: 300, y: 200, rotate: 40, opacity: 0 }, { x: 0, y: 0, rotate: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 4.05);
  tl.fromTo("#shp-t", { x: -200, y: 100, rotate: -30, opacity: 0 }, { x: 0, y: 0, rotate: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 4.4);
  tl.fromTo(".swt", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "expo.out", stagger: 0.08 }, 5.0);
  tl.fromTo("#sb-cap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 5.5);

  K.shutter(tl, "#sh1", 7.2);

  /* SC parallax gallery */
  K.push(tl, "#sc-cam", 7.2, 12.2, 1.0, 1.04);
  tl.fromTo(".ap", { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out", stagger: 0.1 }, 7.3);
  tl.fromTo("#colA", { y: 30 }, { y: -40, duration: 4.6, ease: "sine.inOut" }, 7.5);
  tl.fromTo("#colB", { y: 110 }, { y: -30, duration: 4.6, ease: "sine.inOut" }, 7.5);
  tl.to("#sc-cam", { opacity: 0, duration: 0.3 }, 11.9);

  /* SD system aligns */
  K.push(tl, "#sd-cam", 12.2, 16.0, 1.05, 1.0);
  K.words(tl, "#sd-head", 12.3, { stagger: 0.12 });
  const off = [[-260, -120, -14], [240, -160, 10], [-300, 60, 8], [280, 40, -12], [-200, 220, 16], [220, 260, -8]];
  off.forEach((o, i) => {
    tl.fromTo("#y" + (i + 1), { x: o[0], y: o[1], rotate: o[2], opacity: 0 }, { x: o[0] * 0.4, y: o[1] * 0.4, rotate: o[2] * 0.5, opacity: 1, duration: 0.5, ease: "expo.out" }, 12.3 + i * 0.06);
    tl.to("#y" + (i + 1), { x: 0, y: 0, rotate: 0, duration: 0.7, ease: "expo.inOut" }, 12.9);
  });

  K.shutter(tl, "#sh2", 16.0);
  K.endcard(tl, 16.0);

  window.__timelines["main"] = tl;
  tl.seek(0);
</script>

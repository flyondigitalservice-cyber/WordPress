  K.words(tl, "#sa-hook", 0.25, { stagger: 0.14 });
  tl.fromTo("#feed", { y: 0 }, { y: -3400, duration: 2.7, ease: "power2.inOut" }, 0);
  tl.fromTo("#feed", { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 1.0, ease: "sine.in" }, 0.2);
  tl.to("#feed", { filter: "blur(0px)", duration: 0.5, ease: "sine.out" }, 2.2);
  tl.fromTo("#feedph", { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 0);
  tl.to("#sa-hook .line", { yPercent: -60, opacity: 0, duration: 0.4, ease: "power3.in", stagger: 0.04 }, 2.85);

  /* SB grid */

  sc.forEach((v, i) => {
    const id = "#g" + (i + 1);
    tl.fromTo(id, { x: v[0] * 2, y: v[1] * 2 + 200, rotate: v[2] * 1.5, scale: v[3], opacity: 0 }, { x: v[0], y: v[1], rotate: v[2], scale: v[3], opacity: 1, duration: 0.6, ease: "expo.out" }, 3.35 + i * 0.05);
    tl.to(id, { x: 0, y: 0, rotate: 0, scale: 1, duration: 0.6, ease: "expo.inOut" }, 4.45 + i * 0.02);
    tl.fromTo(id + " .fin", { rotateY: 0 }, { rotateY: 180, duration: 0.8, ease: "expo.inOut" }, 4.8 + (i % 3) * 0.08 + Math.floor(i / 3) * 0.08);

  tl.fromTo("#sb-head .w", { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 5.4);
  K.shutter(tl, "#sh1", 7.2);

  /* SC formats */
  K.push(tl, "#sc-cam", 7.2, 12.2, 1.0, 1.04);
  tl.fromTo("#rc", { x: 120, rotate: 0, opacity: 0 }, { x: 0, rotate: -7, opacity: 1, duration: 0.9, ease: "expo.out" }, 7.45);

  tl.fromTo("#cc", { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 7.35);
  const hs = [["#h1", 7.4, 8.75], ["#h2", 8.85, 10.2], ["#h3", 10.3, null]];
  tl.set(["#h2 .w", "#h3 .w"], { yPercent: 115 }, 0);

    tl.fromTo(h + " .w", { yPercent: 115 }, { yPercent: 0, duration: 0.6, ease: "expo.out", stagger: 0.06 }, a);

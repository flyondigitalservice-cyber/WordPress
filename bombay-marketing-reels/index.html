<!doctype html>
<meta charset="utf-8">
<title>Bombay Sketchbook</title>
<style>html,body{margin:0;background:#141414;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// Bombay Sketchbook: one pen-and-wash page per reel. ?reel=1..12
import { clamp, lerp, seg, eio, eo, hash, vnoise } from '/core/lib.js';
import { REELS, SIGN } from './content.js';
import { ICONS } from './icons.js';

const q = new URLSearchParams(location.search);
const R = REELS[(Number(q.get('reel') || 1) - 1) % REELS.length];
const cv = document.getElementById('c'), W = innerWidth, H = innerHeight, S = W / 1080;
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const PI = Math.PI, TAU = PI * 2;

// ---------- page geometry (page units; 1 unit = 1 px at zoom 1 on a 1080-wide frame) ----------
const PW = 2160, CW = 1080, CH = 800, TOP = 110, SIGN_Y = TOP + 3 * CH, SIGN_H = 820, PH = SIGN_Y + SIGN_H;
const ORDER = [[0, 0], [1, 0], [0, 1], [1, 1], [0, 2], [1, 2]];
const AX = 540, AY = 770, ZC = 1.16;                       // screen anchor and cell zoom
const INK = '#2e2219', BLACK = '#141414', YEL = '#ffc72c', CREAM = '#f7f1e3';
const AMB = [255, 199, 44], NEU = [168, 158, 140], NLT = [205, 197, 180], NDK = [74, 66, 60];   // amber, and one warm neutral at three dilutions

const ue = (t) => 1 - Math.pow(1 - clamp(t), 5);          // the profile's ultra ease-out, cubic-bezier(.16,1,.3,1)
const RS = 1.25 * S;                                       // cell sprite resolution
const F = { h: (s) => `700 ${s}px Caveat, Kalam`, s: (s) => `400 ${s}px Kalam`, b: (s) => `700 ${s}px Kalam`, n: (s) => `400 ${s}px "Reenie Beanie", Caveat` };

const mctx = document.createElement('canvas').getContext('2d');
const tw = (text, font) => { mctx.font = font; return mctx.measureText(text).width; };
const fit = (text, f, size, max) => { const w = tw(text, f(size)); return w > max ? size * max / w : size; };

// ---------- strokes ----------
let SEED = R.n * 1000;
function mkStroke(pts, o = {}) {
  const seed = ++SEED, wob = o.wob ?? 1.5, P = pts.map(p => [p[0], p[1]]), n = P.length;

    const a = P[i], b = P[i + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, m = Math.max(1, Math.ceil(L / 13)), nx = -(b[1] - a[1]) / L, ny = (b[0] - a[0]) / L;

}
function strokePos(s, p) {
  const tgt = s.len * clamp(p); let i = 1; while (i < s.cum.length - 1 && s.cum[i] < tgt) i++;

function drawStroke(g, s, p) {

const ell = (cx, cy, rx, ry, a0, a1) => { const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) * Math.max(rx, ry) / 11)), o = []; for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return o; };

}
// expand icon primitives into strokes, washes and small texts (cell-local units)

      else if (k === 'w') washes.push({ pts: jit(pairs(pr[1])), col: FILL[pr[2]] });
      else if (k === 't') els.push(mkText(pr[4], X(pr[1]), Y(pr[2]), F.h(pr[3] * sc), pr[3] * sc));

}
function mkText(text, x, y, font, size, col) { const w = tw(text, font); return { kind: 't', text, x, y, font, size, w, col, wt: w * 1.7 + 90 }; }
function drawText(g, e, p) {
  if (p <= 0) return; g.save(); g.beginPath(); g.rect(e.x - 12, e.y - e.size * 1.05, (e.w + 24) * clamp(p), e.size * 1.6); g.clip();

}
const textPos = (e, p) => [e.x + e.w * clamp(p), e.y - e.size * .28 + Math.sin(clamp(p) * e.w / (e.size * .16)) * e.size * .14];

    for (let i = 0; i < n; i += step) { const p = w.pts[i], jx = (hash(seed + i * 3.1 + L * 17) - .5) * 13 + 5 - L * 3, jy = (hash(seed + i * 5.7 + L * 29) - .5) * 13 + 4 - L * 2; i ? g.lineTo(p[0] + jx, p[1] + jy) : g.moveTo(p[0] + jx, p[1] + jy); }

    if (!L) { g.strokeStyle = `rgba(${r * .72 | 0},${gg * .72 | 0},${b * .72 | 0},.38)`; g.lineWidth = 2.6; g.lineJoin = 'round'; g.stroke(); }

}
function blobPath(g, cx, cy, rad, seed) { g.beginPath(); for (let i = 0; i <= 72; i++) { const a = i / 72 * TAU, r = rad * (.74 + .34 * vnoise(seed + (i % 72) * .31) + .08 * vnoise(seed * 3 + (i % 72) * 1.3)); i ? g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : g.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } g.closePath(); }

// ---------- textures ----------
function noiseTile(n, a, seed) { const c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'), d = g.createImageData(n, n); for (let i = 0; i < n * n; i++) { const v = hash(seed + i * 1.37); d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = 0; d.data[i * 4 + 3] = v > .62 ? (v - .62) * a : 0; } g.putImageData(d, 0, 0); return c; }
const grainTile = noiseTile(256, 420, 11), toothTile = noiseTile(256, 150, 47);
let paper, desk;
function mkPaper() {
  const k = .5 * S, c = document.createElement('canvas'); c.width = Math.round(PW * k); c.height = Math.round(PH * k); const g = c.getContext('2d'); g.scale(k, k);
  g.fillStyle = CREAM; g.fillRect(0, 0, PW, PH);
  for (let i = 0; i < 260; i++) { const x = hash(i * 3.3 + R.n) * PW, y = hash(i * 7.7 + R.n) * PH, r = 120 + hash(i * 1.9) * 420, d = hash(i * 9.1) > .5; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, d ? 'rgba(150,120,70,.011)' : 'rgba(255,255,255,.05)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
  const ed = g.createLinearGradient(0, 0, PW, 0); ed.addColorStop(0, 'rgba(120,90,40,.16)'); ed.addColorStop(.03, 'rgba(120,90,40,0)'); ed.addColorStop(.97, 'rgba(120,90,40,0)'); ed.addColorStop(1, 'rgba(120,90,40,.16)'); g.fillStyle = ed; g.fillRect(0, 0, PW, PH);
  g.globalAlpha = .22; g.fillStyle = g.createPattern(toothTile, 'repeat'); g.fillRect(0, 0, PW, PH); g.globalAlpha = 1;
  g.strokeStyle = 'rgba(46,34,25,.16)'; g.lineWidth = 2; g.setLineDash([3, 26]); g.beginPath(); g.moveTo(PW / 2, 60); g.lineTo(PW / 2, SIGN_Y - 30); g.stroke(); g.setLineDash([]);   // the gutter's stitch marks

// ---------- timeline ----------

  TP = t + .3; TC = TP + .95; CL = Math.max(durs[6], 3.8); TST = TC + .15 + CL; DUR = Math.round((TST + 2.0) * 60) / 60;

  all.forEach((c, i) => {
    const b = B[i], hook = i === 0, [col, row] = ORDER[i], cx = col * CW, cy = TOP + row * CH;
    const cell = { i, cx, cy, hook, seed: R.n * 31 + i * 7, canvas: document.createElement('canvas'), key: null, sched: [] };
    cell.canvas.width = Math.round(CW * RS); cell.canvas.height = Math.round(CH * RS);
    const { els, washes } = expand(c.art, 90, hook ? 330 : 236);
    cell.els = els; cell.washes = washes;
    const tot = els.reduce((a, e) => a + e.wt, 0);
    let a0, a1;
    if (hook) {
      cell.note = mkText(`Bombay Sketchbook · ${String(R.n).padStart(2, '0')}/12 · ${R.place}`, 92, 66, F.n(50), 50, 'rgba(46,34,25,.78)');
      const sz = Math.min(...c.title.map(s => fit(s, F.h, 112, 900)));
      cell.texts = c.title.map((s, k) => mkText(s, 92, 178 + k * 112, F.h(sz), sz));

      a0 = tB + .05; a1 = b.s + b.L - .08;

    } else {

      const h = mkText(c.h, 92, 122, F.h(hs), hs, BLACK), s2 = mkText(c.s, 94, 196, F.s(ss2), ss2);
      a0 = b.s + .45; a1 = b.s + b.L * .46;
      h.t0 = a1 + Math.min(1.5, b.L * .2); h.t1 = h.t0 + Math.min(.7, b.L * .12); s2.t0 = h.t1 + .08; s2.t1 = Math.min(b.s + b.L - .12, s2.t0 + .8);   // the hold before labels
      cell.texts = [h, s2]; cell.w0 = a1 - .2;
      cell.hl = { x: h.x - 14, y: h.y - hs * .34, w: h.w + 30, h: hs * .46, t0: h.t1 - .05, t1: h.t1 + .4 };
    }

    cell.w1 = cell.w0 + 1.1;

// ---------- camera ----------
